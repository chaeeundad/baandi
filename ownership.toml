# Machine-readable ownership and gates. Agents read this before editing.
# "frozen" = public API or shared contract; change only when a ticket says so (single owner).
[global]
frozen = ["Cargo.toml", "rust-toolchain.toml", "docs/physics-conventions.md", "docs/schemas/", "ownership.toml", "AGENTS.md"]
gates = "scripts/check.sh"

[crates.dft-units]      # units and constants
deps = []
[crates.dft-geometry]   # cell, atoms, reciprocal lattice
deps = ["dft-units"]
[crates.dft-numerics]   # numerical adapters; unsafe/FFI lives here and in dft-mkl
deps = ["dft-mkl"]   # optional, feature `mkl` only
unsafe_allowed = true
[crates.dft-mkl]       # optional MKL FFI adapter (ADR 0019); linked only through the dft-numerics `mkl` feature
deps = []
unsafe_allowed = true
[crates.dft-basis]      # G-vectors, cutoff, FFT index mapping
deps = ["dft-units", "dft-geometry", "dft-numerics"]
[crates.dft-upf]        # independent UPF v2 NC parser
deps = ["dft-units"]
[crates.dft-physics]    # potentials, Hamiltonian, density, XC
deps = ["dft-units", "dft-geometry", "dft-numerics", "dft-basis", "dft-upf", "dft-solvers"]   # solvers only for the LinearOperator trait
[crates.dft-solvers]    # eigensolvers, mixers, SCF driver pieces
deps = ["dft-numerics"]
[crates.dft-engine]     # orchestration and energy audit
deps = ["dft-physics", "dft-solvers", "dft-basis", "dft-geometry", "dft-upf"]
[crates.dft-cli]        # I/O only, no numerics
deps = ["dft-engine", "dft-units", "dft-geometry", "dft-basis", "dft-upf", "dft-physics", "dft-solvers"]   # direct deps on lower crates allowed until dft-engine exists
[crates.baandi-mcp]    # MCP stdio adapter (ADRs 0028, 0029); serde/serde_json only, no SDK or async runtime
deps = ["dft-engine"]
[crates.baandi-py]     # PyO3 binding and ASE calculator (agent/workflow path, ADR 0030); nothing in the core depends on it
deps = ["dft-engine", "dft-units"]
