# expected_driver = strict_oracle
# expected_reason = G4D_FALLBACK: free-moment collinear FD with PBE not yet qualified; R6a retains L1 regardless of G4B switches
# command = run
# expected_parse = ok
# switches = BAANDI_REFERENCE_SCF=on; BAANDI_REFERENCE_STRICT=off; all others registry defaults unless [performance] overrides
# upf_requirements = NC; nonzero PP_RHOATOM and s/p PP_PSWFC; functional matches XC
# R0 freezes current behavior; the parse-only test does not execute this command or read UPFs.
[system]
name = "R0 routing Si2"
lattice_unit = "bohr"
lattice_vectors = [[0.0,4.0,4.0],[4.0,0.0,4.0],[4.0,4.0,0.0]]
[[system.atoms]]
species = "Si"
fractional = [0.0,0.0,0.0]
[[system.atoms]]
species = "Si"
fractional = [0.25,0.25,0.25]
[pseudopotentials]
Si = "synthetic-atomic.upf"
[basis]
ecutwfc_ry = 3.0
kpoints = [[0.0,0.0,0.0]]
[xc]
functional = "pbe"
[scf]
max_iterations = 100
[occupations]
mode = "fermi_dirac"
smearing_ha = 0.01
band_cap = 16
[spin]
mode = "collinear"
