# Validate-only in debug tests; run numerical workflows with a release build.
# Compact structure form: magmom (Bohr magnetons) per atom; the sum becomes
# spin.initial_moment_seed (here 2.0, a start value, not a constraint).
[structure]
name = "Fe bcc fixed moment"
lattice_unit = "angstrom"
lattice = [[-1.435, 1.435, 1.435], [1.435, -1.435, 1.435], [1.435, 1.435, -1.435]]
coordinates = "fractional"
atoms = """
Fe  0.0  0.0  0.0  magmom=2.0
"""

[pseudopotentials]
Fe = "/absolute/path/to/pseudo/Fe.upf"

[basis]
ecutwfc_ry = 60.0
kgrid = [2, 2, 2]
kshift = [0.5, 0.5, 0.5]
ktime_reversal = false

[xc]
functional = "pbe"

[spin]
mode = "collinear"
total_moment = 2.0

[occupations]
mode = "fermi_dirac"
smearing_ev = 0.2
band_cap = 24
