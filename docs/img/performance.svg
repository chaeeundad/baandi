<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-label="Wall time of rust-dft optimization steps and Quantum ESPRESSO 7.6 on the same node" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Wall time of rust-dft optimization steps and Quantum ESPRESSO 7.6 on the same node</title>
<rect width="800" height="410" fill="#ffffff"/>
<text x="20.0" y="24.0" font-size="14" text-anchor="start" fill="#1f2328" font-weight="bold">Wall time on one node (Si, 30 Ry): rust-dft optimization steps against QE 7.6</text>
<line x1="230.0" y1="50" x2="230.0" y2="354" stroke="#d1d9e0"/><text x="230.0" y="370.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">0.1 s</text>
<line x1="344.9" y1="50" x2="344.9" y2="354" stroke="#d1d9e0"/><text x="344.9" y="370.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">1 s</text>
<line x1="459.8" y1="50" x2="459.8" y2="354" stroke="#d1d9e0"/><text x="459.8" y="370.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">10 s</text>
<line x1="574.7" y1="50" x2="574.7" y2="354" stroke="#d1d9e0"/><text x="574.7" y="370.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">100 s</text>
<text x="500.0" y="388.0" font-size="12" text-anchor="middle" fill="#59636e" font-weight="normal">wall time (median of 3 for rust-dft steps, mean of 3 for QE; log scale)</text>
<text x="218.0" y="76.0" font-size="12" text-anchor="end" fill="#1f2328" font-weight="bold">Gamma, 1 k point, 30 Ry</text>
<text x="218.0" y="92.0" font-size="11" text-anchor="end" fill="#59636e" font-weight="normal">1 k point(s)</text>
<rect x="230" y="62" width="156.0" height="16" fill="#7fb2e5"/><text x="392.0" y="74.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">2.28 s  before optimization</text>
<rect x="230" y="84" width="124.8" height="16" fill="#3d85d1"/><text x="360.8" y="96.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">1.22 s  O1 + O3 (FFT)</text>
<rect x="230" y="106" width="97.8" height="16" fill="#0b6bcb"/><text x="333.8" y="118.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">0.71 s  + O4a/b (Davidson)</text>
<rect x="230" y="128" width="38.6" height="16" fill="#c2410c"/><text x="274.6" y="140.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">0.217 s  QE, 1 MPI process</text>
<rect x="230" y="150" width="27.4" height="16" fill="#7c3aed"/><text x="263.4" y="162.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">0.173 s  QE, 4 MPI processes</text>
<text x="218.0" y="216.0" font-size="12" text-anchor="end" fill="#1f2328" font-weight="bold">4x4x4 shifted, 32 k points, 30 Ry</text>
<text x="218.0" y="232.0" font-size="11" text-anchor="end" fill="#59636e" font-weight="normal">32 k point(s)</text>
<rect x="230" y="202" width="344.2" height="16" fill="#7fb2e5"/><text x="580.2" y="214.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">99 s  before optimization</text>
<rect x="230" y="224" width="307.0" height="16" fill="#3d85d1"/><text x="543.0" y="236.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">47 s  O1 + O3 (FFT)</text>
<rect x="230" y="246" width="270.0" height="16" fill="#0b6bcb"/><text x="506.0" y="258.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">22.4 s  + O4a/b (Davidson)</text>
<rect x="230" y="268" width="144.7" height="16" fill="#c2410c"/><text x="380.7" y="280.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">1.82 s  QE, 1 MPI process</text>
<rect x="230" y="290" width="108.5" height="16" fill="#7c3aed"/><text x="344.5" y="302.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">0.88 s  QE, 4 MPI processes</text>
</svg>
