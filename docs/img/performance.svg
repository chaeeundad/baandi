<svg xmlns="http://www.w3.org/2000/svg" width="760" height="322" viewBox="0 0 760 322" role="img" aria-label="Wall time of rust-dft and Quantum ESPRESSO 7.6 on the same node" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Wall time of rust-dft and Quantum ESPRESSO 7.6 on the same node</title>
<rect width="760" height="322" fill="#ffffff"/>
<text x="20.0" y="24.0" font-size="14" text-anchor="start" fill="#1f2328" font-weight="bold">Wall time on one node (Si, 30 Ry): rust-dft is not yet optimized</text>
<line x1="210.0" y1="50" x2="210.0" y2="266" stroke="#d1d9e0"/><text x="210.0" y="282.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">0.1 s</text>
<line x1="330.9" y1="50" x2="330.9" y2="266" stroke="#d1d9e0"/><text x="330.9" y="282.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">1 s</text>
<line x1="451.9" y1="50" x2="451.9" y2="266" stroke="#d1d9e0"/><text x="451.9" y="282.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">10 s</text>
<line x1="572.8" y1="50" x2="572.8" y2="266" stroke="#d1d9e0"/><text x="572.8" y="282.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">100 s</text>
<text x="470.0" y="300.0" font-size="12" text-anchor="middle" fill="#59636e" font-weight="normal">wall time, mean of 3 runs (log scale)</text>
<text x="198.0" y="76.0" font-size="12" text-anchor="end" fill="#1f2328" font-weight="bold">Gamma only, 30 Ry</text>
<text x="198.0" y="92.0" font-size="11" text-anchor="end" fill="#59636e" font-weight="normal">1 k point(s)</text>
<rect x="210" y="62" width="164.3" height="16" fill="#0b6bcb"/><text x="380.3" y="74.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">2.28 s  rust-dft, 1 thread</text>
<rect x="210" y="84" width="40.6" height="16" fill="#c2410c"/><text x="256.6" y="96.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">0.217 s  QE, 1 MPI process</text>
<rect x="210" y="106" width="28.9" height="16" fill="#7c3aed"/><text x="244.9" y="118.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">0.173 s  QE, 4 MPI processes</text>
<text x="198.0" y="172.0" font-size="12" text-anchor="end" fill="#1f2328" font-weight="bold">4x4x4 shifted, 30 Ry</text>
<text x="198.0" y="188.0" font-size="11" text-anchor="end" fill="#59636e" font-weight="normal">32 k point(s)</text>
<rect x="210" y="158" width="359.7" height="16" fill="#0b6bcb"/><text x="575.7" y="170.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">94.3 s  rust-dft, 1 thread</text>
<rect x="210" y="180" width="152.3" height="16" fill="#c2410c"/><text x="368.3" y="192.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">1.82 s  QE, 1 MPI process</text>
<rect x="210" y="202" width="114.2" height="16" fill="#7c3aed"/><text x="330.2" y="214.0" font-size="11" text-anchor="start" fill="#1f2328" font-weight="normal">0.88 s  QE, 4 MPI processes</text>
</svg>
