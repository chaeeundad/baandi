[package]
name = "dft-dispersion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Grimme DFT-D3 dispersion through the simple-dftd3 C API loaded at run time (ADR 0048); the only place with FFI for it. Nothing is loaded without feature `dftd3`."

# This crate is an FFI adapter: unsafe is allowed in `src/ffi.rs` only, every
# unsafe block documents its preconditions.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[features]
default = []
# Load libs-dftd3 (LGPL-3.0-or-later, not linked, dlopen at run time) through libloading.
dftd3 = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }

[dev-dependencies]
serde_json.workspace = true
