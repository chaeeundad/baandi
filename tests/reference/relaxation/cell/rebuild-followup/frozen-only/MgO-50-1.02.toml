[basis]
ecutwfc_ry = 100
kgrid = [3, 3, 3]
kshift = [0.5, 0.5, 0.5]

[pseudopotentials]
Mg = "/Users/mino/Develop/rust-dft-wt/pseudo/pseudodojo/ex/Mg.upf"
O = "/Users/mino/Develop/rust-dft-wt/pseudo/pseudodojo/ex/O.upf"

[scf]
density_residual_tolerance = 0.000000001
eigen_tolerance = 0.0000000001
energy_tolerance_ha = 0.00000000001
extra_bands = 4
max_iterations = 300
mixing = "kerker-pulay"
mixing_beta = 0.3
mixing_q0_inverse_bohr = 1.0
threads = 4

[spin]
mode = "unpolarized"

[system]
lattice_unit = "bohr"
lattice_vectors = [[0.0, 4.0545, 4.0545], [4.0545, 0.0, 4.0545], [4.0545, 4.0545, 0.0]]
name = "mgo bulk smoke, no accuracy claim"

[[system.atoms]]
fractional = [0, 0, 0]
species = "Mg"

[[system.atoms]]
fractional = [0.5, 0.5, 0.5]
species = "O"

[xc]
density_floor = 0.0000000001
functional = "pbe"

[relax]
mode='cell'
cell_dofs='isotropic'
max_steps=100
stress_tol_ha_bohr3=1e-7
energy_tol_ha=1e-9
[symmetry]
mode='auto'
