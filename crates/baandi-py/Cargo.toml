[package]
name = "baandi-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "_baandi"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
# Only wheel builds enable the Python ABI; ordinary workspace gates need no Python.
python-extension = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }
dft-engine = { path = "../dft-engine" }
dft-units = { path = "../dft-units" }
