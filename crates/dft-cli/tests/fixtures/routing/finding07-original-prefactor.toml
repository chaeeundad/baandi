# expected_driver = reference
# expected_reason = none (R6b supports original PW92)
# command = run
# expected_parse = ok
# switches = BAANDI_REFERENCE_SCF=on; BAANDI_REFERENCE_STRICT=off; all others registry defaults unless [performance] overrides
# upf_requirements = NC; nonzero PP_RHOATOM and s/p PP_PSWFC; functional matches XC
# R6b supports this convention on the reference driver; driver_routing checks eligibility.
[system]
name = "R0 routing Si2"
lattice_unit = "bohr"
lattice_vectors = [[0.0,4.0,4.0],[4.0,0.0,4.0],[4.0,4.0,0.0]]
[[system.atoms]]
species = "Si"
fractional = [0.0,0.0,0.0]
[[system.atoms]]
species = "Si"
fractional = [0.25,0.25,0.25]
[pseudopotentials]
Si = "synthetic-atomic.upf"
[basis]
ecutwfc_ry = 3.0
kpoints = [[0.0,0.0,0.0]]
[xc]
functional = "pbe"
pw92_prefactor = "original"
[scf]
max_iterations = 100
