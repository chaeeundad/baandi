# expected_driver = rejected
# expected_reason = config rejects reference mixing before SCF; no fallback today
# command = run
# expected_parse = error:unknown
# switches = BAANDI_REFERENCE_SCF=on; BAANDI_REFERENCE_STRICT=off; all others registry defaults unless [performance] overrides
# upf_requirements = NC; nonzero PP_RHOATOM and s/p PP_PSWFC; functional matches XC
# R0 driver/reason comments are historical; R1 routing expectations are in expectations.json.
[system]
name = "R0 routing Si2"
lattice_unit = "bohr"
lattice_vectors = [[0.0,4.0,4.0],[4.0,0.0,4.0],[4.0,4.0,0.0]]
[[system.atoms]]
species = "Si"
fractional = [0.0,0.0,0.0]
[[system.atoms]]
species = "Si"
fractional = [0.25,0.25,0.25]
[pseudopotentials]
Si = "synthetic-atomic.upf"
[basis]
ecutwfc_ry = 3.0
kpoints = [[0.0,0.0,0.0]]
[xc]
functional = "lda-pz"
[scf]
max_iterations = 100
mixing_q0_inverse_bohr = 1.0
