[system]
name = "R3 C diamond 4x4x4 RPA"
lattice_unit = "bohr"
lattice_vectors = [[0.0,3.37032,3.37032],[3.37032,0.0,3.37032],[3.37032,3.37032,0.0]]
[[system.atoms]]
species = "C"
fractional = [0.0,0.0,0.0]
[[system.atoms]]
species = "C"
fractional = [0.25,0.25,0.25]
[pseudopotentials]
