[system]
name = "R1 Si2 skewed 4x4x4 dielectric"
lattice_unit = "bohr"
lattice_vectors = [[0.3,5.130606428358966,5.3306064283589665],[5.030606428358967,0.4,5.130606428358966],[5.130606428358966,5.430606428358966,-0.2]]
[[system.atoms]]
species = "Si"
fractional = [0.01,-0.02,0.0]
[[system.atoms]]
species = "Si"
fractional = [0.26,0.24,0.255]
[pseudopotentials]
Si = "Si.pz-vbc.UPF"
[basis]
ecutwfc_ry = 30
kgrid = [4,4,4]
[xc]
functional = "lda-pz"
[response]
ecut_chi_ha = 3.0
bands = 100
band_solver = "dense"
