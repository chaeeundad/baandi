[package]
name = "dft-cli"
default-run = "baandi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# The command is `baandi`; `dft-cli` remains as a deprecated alias of the same
# program so existing scripts keep working (removal announced in docs/cli.md).
[[bin]]
name = "baandi"
path = "src/main.rs"

[[bin]]
name = "dft-cli"
path = "src/main.rs"

[features]
default = []
# Optional Intel MKL backend (ADR 0019): enables dft-numerics/mkl for every crate in the build.
mkl = ["dft-numerics/mkl"]
# MKL build with per-call-site dgemm timers printed to stderr when BAANDI_DGEMM_TIMERS is set.
# MPI row-block parallel layer (ADR 0041): links Open MPI through dft-mpi; the default build links nothing.
mpi = ["dft-mpi/mpi"]
dgemm-timers = ["dft-numerics/dgemm-timers"]

[dependencies]
dft-numerics = { path = "../dft-numerics" }
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
dft-basis = { path = "../dft-basis" }
dft-geometry = { path = "../dft-geometry" }
dft-units = { path = "../dft-units" }
dft-upf = { path = "../dft-upf" }
dft-engine = { path = "../dft-engine", features = ["strict-oracle"] }
dft-mpi = { path = "../dft-mpi" }

dft-physics = { path = "../dft-physics" }

[dev-dependencies]
# examples/davidson_bench.rs (stage-0 benchmark) reads the solver counters.
dft-solvers = { path = "../dft-solvers" }
