[basis]
ecutwfc_ry = 60
kgrid = [4, 4, 4]
kshift = [0.5, 0.5, 0.5]

[pseudopotentials]
Si = "/Users/mino/Develop/rust-dft-wt/pseudo/pseudodojo/ex/Si.upf"

[scf]
density_residual_tolerance = 0.000000001
