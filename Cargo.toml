[workspace]
resolver = "3"
members = [
    "crates/dft-units",
    "crates/dft-geometry",
    "crates/dft-numerics",
    "crates/dft-basis",
    "crates/dft-upf",
    "crates/dft-physics",
    "crates/dft-solvers",
    "crates/dft-engine",
    "crates/dft-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
ndarray = "0.17"
num-complex = "0.4"
rustfft = "6.4"
faer = "0.24"
xcx = "0.3"
libm = "0.2"
upf = "0.1"
sha2 = "0.10"
serde_json = "1"
ndrustfft = "0.6"
nalgebra = "0.35"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
