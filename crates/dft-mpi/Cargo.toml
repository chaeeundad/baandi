[package]
name = "dft-mpi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Optional MPI adapter (Open MPI ABI): the only place with MPI FFI. Without feature `mpi` a single-rank stand-in with identical semantics is used and nothing is linked."

# FFI adapter: unsafe is allowed here only, every unsafe block documents its preconditions.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[features]
default = []
mpi = []

[[example]]
name = "mpi_smoke"
