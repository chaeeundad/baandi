[workspace]
resolver = "3"
members = [
    "crates/dft-units",
    "crates/dft-geometry",
    "crates/dft-numerics",
    "crates/dft-basis",
    "crates/dft-upf",
    "crates/dft-physics",
    "crates/dft-solvers",
    "crates/dft-engine",
    "crates/dft-cli",
    "crates/dft-mkl",
    "crates/dft-mpi",
    "crates/dft-dispersion",
    "crates/dft-response",
    "crates/baandi-mcp",
    "crates/baandi-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
ndarray = "0.17"
num-complex = "0.4"
rustfft = "6.4"
faer = "0.24"
xcx = "0.3"
libm = "0.2"
exmex = { version = "0.21", default-features = false }
uom = { version = "0.38", default-features = false, features = ["f64", "si", "std"] }
upf = "0.1"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
ndrustfft = "0.6"
nalgebra = "0.35"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
# UX1 (ADR 0053): `baandi watch` terminal UI; crossterm comes through ratatui-crossterm.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# Debug/test builds only (the release profile is unchanged). Optimizing the dev
# profile cut the debug test run of scripts/check.sh from 379 s to 104 s (cold
# gate 458 s -> 256 s, Mac, 2026-11-18, docs/performance/slow-tests.md) with the
# same 695 passed tests, bit-comparison tests included: rustc does not contract
# or reorder floating-point operations at any opt-level, and debug assertions
# and overflow checks stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
