# Validate-only in debug tests; run numerical workflows with a release build.
# Compact structure form (docs/cli.md, "Structure input").
[structure]
name = "Displaced Si8"
lattice_unit = "angstrom"
lattice = [[5.43, 0.0, 0.0], [0.0, 5.43, 0.0], [0.0, 0.0, 5.43]]
coordinates = "fractional"
atoms = """
Si  0.002  0     0
Si  0      0.5   0.5
Si  0.5    0     0.5
Si  0.5    0.5   0
Si  0.25   0.25  0.25
Si  0.25   0.75  0.75
Si  0.75   0.25  0.75
Si  0.75   0.75  0.25
"""

[pseudopotentials]
Si = "/absolute/path/to/pseudo/Si.pz-vbc.UPF"

[basis]
ecutwfc_ry = 30.0
kpoints = [[0.0, 0.0, 0.0]]

[xc]
functional = "lda-pz"

[output]
forces = true
stress = true

[relax]
mode = "ions"
method = "bfgs"
max_steps = 40
force_tol_ha_bohr = 1e-3
energy_tol_ha = 1e-8
max_displacement_bohr = 0.1
