[package]
name = "dft-numerics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
mkl = ["dep:dft-mkl", "dft-mkl/mkl"]
# Per-call-site dgemm timers (measurement builds only; implies mkl).
dgemm-timers = ["mkl", "dft-mkl/dgemm-timers"]

[dependencies]
dft-mkl = { path = "../dft-mkl", optional = true }
ndarray.workspace = true
num-complex.workspace = true
rustfft.workspace = true
thiserror.workspace = true
faer.workspace = true
rayon = "=1.12.0"
# P48B packed real GEMM kernel: safe SIMD dispatch (already in the lockfile
# through faer). Default features off so that the feature set seen by faer, and
# with it faer's own x86 dispatch, is unchanged.
pulp = { version = "=0.22.3", default-features = false, features = ["std"] }

[dev-dependencies]
ndrustfft.workspace = true
