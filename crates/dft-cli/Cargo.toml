[package]
name = "dft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Optional Intel MKL backend (ADR 0019): enables dft-numerics/mkl for every crate in the build.
mkl = ["dft-numerics/mkl"]
# MKL build with per-call-site dgemm timers printed to stderr when BAANDI_DGEMM_TIMERS is set.
dgemm-timers = ["dft-numerics/dgemm-timers"]

[dependencies]
dft-numerics = { path = "../dft-numerics" }
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
dft-basis = { path = "../dft-basis" }
dft-geometry = { path = "../dft-geometry" }
dft-units = { path = "../dft-units" }
dft-upf = { path = "../dft-upf" }
dft-engine = { path = "../dft-engine" }

dft-physics = { path = "../dft-physics" }
